<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Stadtbibliothek</title>

  <!-- iOS App Setup & Icon Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bibliothek">
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluent/180/000000/book.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ios: {
              bg: '#F2F2F7',
              card: '#FFFFFF',
              blue: '#007AFF',
              green: '#34C759',
              red: '#FF3B30',
              orange: '#FF9500',
              gray: '#8E8E93',
              lightGray: '#E5E5EA',
              darkText: '#000000',
              subText: '#3C3C43'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 20px); }
  </style>
</head>
<body class="bg-ios-bg text-ios-darkText min-h-screen flex flex-col justify-between select-none">

  <!-- Header -->
  <header class="bg-ios-card border-b border-gray-200 sticky top-0 z-20 pt-safe px-4 pb-3 shadow-sm">
    <div class="max-w-md mx-auto text-center">
      <h1 class="text-xl font-bold tracking-tight">Stadtbibliothek</h1>
      <p class="text-xs text-ios-gray">Aktuelle Öffnungszeiten</p>
    </div>
  </header>

  <!-- Hauptinhalt -->
  <main class="flex-grow max-w-md w-full mx-auto p-4 space-y-5">

    <!-- Live Status Card -->
    <div id="status-card" class="rounded-2xl p-5 text-white shadow-md transition-all duration-300">
      <div class="flex justify-between items-start">
        <div>
          <span id="status-badge" class="inline-block px-2.5 py-1 rounded-full text-xs font-semibold uppercase tracking-wider mb-2 bg-white/20 backdrop-blur-md">
            Status laden...
          </span>
          <h2 id="status-title" class="text-2xl font-bold">...</h2>
        </div>
        <div class="w-12 h-12 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center text-2xl">
          <i id="status-icon" class="fa-solid fa-clock"></i>
        </div>
      </div>
      <p id="status-subtitle" class="text-sm mt-3 opacity-90">Analyse der Öffnungszeiten...</p>
    </div>

    <!-- Push-Benachrichtigung Button / status -->
    <div id="notification-card" class="bg-ios-card rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-blue-50 text-ios-blue flex items-center justify-center text-lg">
          <i class="fa-solid fa-bell"></i>
        </div>
        <div>
          <h4 class="font-bold text-xs">Schließ-Erinnerung</h4>
          <p class="text-[11px] text-ios-gray" id="notif-status-text">Erinnerung 20 Min. vor Schluss</p>
        </div>
      </div>
      <button id="notif-btn" onclick="requestNotificationPermission()" class="px-3 py-1.5 bg-ios-blue text-white rounded-xl text-xs font-semibold shadow-sm hover:bg-blue-600 transition">
        Aktivieren
      </button>
    </div>

    <!-- Wochenübersicht -->
    <div class="bg-ios-card rounded-2xl p-4 shadow-sm border border-gray-100">
      <h3 class="font-bold text-base mb-3 flex items-center gap-2">
        <i class="fa-regular fa-calendar-alt text-ios-blue"></i>
        Öffnungszeiten diese Woche
      </h3>
      <div id="hours-list" class="space-y-2 text-sm">
        <!-- Dynamisch befüllt -->
      </div>
    </div>

    <!-- Hinweis auf zukünftige Entwicklung -->
    <div class="bg-ios-card rounded-2xl p-4 border border-gray-100 text-center space-y-1 mt-6">
      <div class="text-ios-blue text-lg"><i class="fa-solid fa-code"></i></div>
      <p class="text-xs font-bold text-ios-darkText">Hinweis zur App</p>
      <p class="text-xs text-ios-gray">Diese App wird demnächst weiterentwickelt. Weitere Funktionen folgen in Kürze!</p>
    </div>

  </main>

  <!-- Footer / Bottom Space -->
  <footer class="text-center py-4 text-[11px] text-ios-gray pb-safe">
    &copy; Stadtbibliothek
  </footer>

  <!-- Logik für Öffnungszeiten & Push-Mitteilung -->
  <script>
    // Öffnungszeiten Definition
    const openingHours = {
      1: { name: 'Montag', open: '17:00', close: '19:00', startH: 17, startM: 0, endH: 19, endM: 0 },
      2: { name: 'Dienstag', open: '17:00', close: '20:00', startH: 17, startM: 0, endH: 20, endM: 0 },
      3: { name: 'Mittwoch', open: '17:00', close: '20:00', startH: 17, startM: 0, endH: 20, endM: 0 },
      4: { name: 'Donnerstag', open: '17:30', close: '20:00', startH: 17, startM: 30, endH: 20, endM: 0 },
      5: { name: 'Freitag', open: '17:00', close: '19:00', startH: 17, startM: 0, endH: 19, endM: 0 },
      6: { name: 'Samstag', open: '09:00', close: '16:00', startH: 9, startM: 0, endH: 16, endM: 0 },
      0: { name: 'Sonntag', open: '10:00', close: '16:00', startH: 10, startM: 0, endH: 16, endM: 0 }
    };

    let notificationSentToday = false;

    function updateOpeningStatus() {
      const now = new Date();
      const currentDay = now.getDay();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      
      const todaySchedule = openingHours[currentDay];
      const startMinutes = todaySchedule.startH * 60 + todaySchedule.startM;
      const endMinutes = todaySchedule.endH * 60 + todaySchedule.endM;

      const card = document.getElementById('status-card');
      const badge = document.getElementById('status-badge');
      const title = document.getElementById('status-title');
      const subtitle = document.getElementById('status-subtitle');
      const icon = document.getElementById('status-icon');

      if (currentMinutes >= startMinutes && currentMinutes < endMinutes) {
        // Geöffnet
        const minutesLeft = endMinutes - currentMinutes;
        const hoursLeft = Math.floor(minutesLeft / 60);
        const minsRemaining = minutesLeft % 60;
        let timeLeftStr = hoursLeft > 0 ? `${hoursLeft} Std. und ${minsRemaining} Min.` : `${minsRemaining} Min.`;

        card.className = "rounded-2xl p-5 text-white shadow-md bg-gradient-to-br from-green-500 to-emerald-700 transition-all duration-300";
        badge.innerText = "Jetzt Geöffnet";
        title.innerText = "Willkommen!";
        subtitle.innerText = `Schließt heute um ${todaySchedule.close} Uhr (in ${timeLeftStr}).`;
        icon.className = "fa-solid fa-door-open";

        // Prüfen auf 20 Minuten vor Ladenschluss für Benachrichtigung
        if (minutesLeft <= 20 && minutesLeft > 0 && !notificationSentToday) {
          sendClosingNotification(todaySchedule.close);
          notificationSentToday = true;
        }

      } else {
        // Geschlossen
        card.className = "rounded-2xl p-5 text-white shadow-md bg-gradient-to-br from-slate-700 to-slate-900 transition-all duration-300";
        badge.innerText = "Geschlossen";
        title.innerText = "Derzeit geschlossen";
        icon.className = "fa-solid fa-door-closed";

        if (currentMinutes < startMinutes) {
          subtitle.innerText = `Öffnet heute um ${todaySchedule.open} Uhr.`;
        } else {
          const nextDay = (currentDay + 1) % 7;
          const nextSchedule = openingHours[nextDay];
          subtitle.innerText = `Öffnet ${nextSchedule.name} um ${nextSchedule.open} Uhr.`;
          notificationSentToday = false; // Reset für den nächsten Tag
        }
      }
    }

    function renderHoursList() {
      const container = document.getElementById('hours-list');
      const today = new Date().getDay();
      const daysOrder = [1, 2, 3, 4, 5, 6, 0];
      
      container.innerHTML = daysOrder.map(dayIdx => {
        const item = openingHours[dayIdx];
        const isToday = dayIdx === today;
        return `
          <div class="flex justify-between items-center py-1.5 ${isToday ? 'font-bold text-ios-blue bg-blue-50 px-2 rounded-lg -mx-2' : 'text-ios-subText'}">
            <span class="flex items-center gap-2">
              ${isToday ? '<span class="w-1.5 h-1.5 rounded-full bg-ios-blue"></span>' : '<span class="w-1.5 h-1.5"></span>'}
              ${item.name}
            </span>
            <span class="font-mono text-xs">${item.open} - ${item.close} Uhr</span>
          </div>
        `;
      }).join('');
    }

    // Push Notification Logik
    function checkNotificationStatus() {
      const btn = document.getElementById('notif-btn');
      const text = document.getElementById('notif-status-text');

      if (!("Notification" in window)) {
        text.innerText = "Benachrichtigungen werden von diesem Browser nicht unterstützt.";
        btn.classList.add('hidden');
        return;
      }

      if (Notification.permission === "granted") {
        text.innerText = "Erinnerung ist aktiv (20 Min. vor Schluss).";
        btn.innerText = "Aktiviert";
        btn.disabled = true;
        btn.className = "px-3 py-1.5 bg-green-100 text-ios-green rounded-xl text-xs font-semibold cursor-default";
      } else if (Notification.permission === "denied") {
        text.innerText = "Mitteilungen sind in den iPhone-Einstellungen deaktiviert.";
        btn.classList.add('hidden');
      }
    }

    function requestNotificationPermission() {
      if (!("Notification" in window)) return;

      Notification.requestPermission().then(permission => {
        checkNotificationStatus();
        if (permission === "granted") {
          new Notification("Stadtbibliothek", {
            body: "Erinnerung aktiviert! Wir benachrichtigen Sie 20 Minuten vor Ladenschluss.",
            icon: "https://img.icons8.com/fluent/180/000000/book.png"
          });
        }
      });
    }

    function sendClosingNotification(closeTime) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("Stadtbibliothek schließt bald!", {
          body: `Die Bibliothek schließt in 20 Minuten (um ${closeTime} Uhr). Bitte begeben Sie sich langsam zur Ausleihe/Kasse.`,
          icon: "https://img.icons8.com/fluent/180/000000/book.png"
        });
      }
    }

    // Initialisierung
    window.onload = function() {
      updateOpeningStatus();
      renderHoursList();
      checkNotificationStatus();
      setInterval(updateOpeningStatus, 30000); // Alle 30 Sekunden prüfen
    };
  </script>
</body>
</html>
